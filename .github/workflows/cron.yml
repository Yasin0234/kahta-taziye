name: Kahta Taziye Otomatik Senkronizasyon

on:
  schedule:
    # Her 15 dakikada bir otomatik çalışır
    - cron: '*/15 * * * *'
  # GitHub arayüzünden tek tıkla manuel tetikleme imkanı
  workflow_dispatch:

jobs:
  sync:
    name: Vercel Sync Tetikleyici
    runs-on: ubuntu-latest
    steps:
      - name: Vercel Sync Endpoint Çağrısı
        run: |
          echo "🚀 Kahta Taziye senkronizasyonu başlatılıyor..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X GET "${{ secrets.VERCEL_PROJECT_URL }}/api/sync" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          
          HTTP_BODY=$(echo "$RESPONSE" | sed -e '$d')
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1 | cut -d':' -f2)

          echo "Yanıt Kodu: $HTTP_STATUS"
          echo "Yanıt Gövdesi: $HTTP_BODY"

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "❌ Senkronizasyon başarısız oldu!"
            exit 1
          fi

          echo "✅ Senkronizasyon başarıyla tamamlandı!"
