name: Kahta Taziye Otomatik Senkronizasyon

on:
  schedule:
    # Her 1 saatte bir (saat başı) otomatik çalışır
    - cron: '0 * * * *'
  # GitHub arayüzünden tek tıkla manuel tetikleme imkanı
  workflow_dispatch:

jobs:
  sync:
    name: Vercel Sync Tetikleyici
    runs-on: ubuntu-latest
    steps:
      - name: Vercel Sync Endpoint Çağrısı
        run: |
          echo "🚀 Kahta Taziye senkronizasyonu başlatılıyor..."
          TARGET_URL="https://kahta-taziye.vercel.app/api/sync"
          echo "Hedef URL: $TARGET_URL"

          RESPONSE=$(curl -s -L -w "\nHTTP_STATUS:%{http_code}" -X GET "$TARGET_URL" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          
          HTTP_BODY=$(echo "$RESPONSE" | sed -e '$d')
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1 | cut -d':' -f2)

          echo "Yanıt Kodu: $HTTP_STATUS"
          echo "Yanıt Gövdesi: $HTTP_BODY"

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "❌ Senkronizasyon başarısız oldu!"
            exit 1
          fi

          echo "✅ Senkronizasyon başarıyla tamamlandı!"
