<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kahta Taziye Otomasyon Servisi</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: #1e293b;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      text-align: center;
      max-width: 480px;
      width: 90%;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 8px;
    }
    p {
      color: #94a3b8;
      font-size: 15px;
      line-height: 1.6;
    }
    .badge {
      display: inline-block;
      background: #10b981;
      color: #ffffff;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      margin-top: 15px;
    }
    .links {
      margin-top: 25px;
      display: flex;
      gap: 10px;
      justify-content: center;
    }
    a {
      color: #38bdf8;
      text-decoration: none;
      font-size: 14px;
      padding: 8px 16px;
      border: 1px solid #334155;
      border-radius: 8px;
      transition: background 0.2s;
    }
    a:hover {
      background: #334155;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🕊️ Kahta Taziye Otomasyonu</h1>
    <p>Kahta Belediyesi taziye ilanları otomatik senkronizasyon ve bildirim servisi aktif olarak çalışmaktadır.</p>
    <div class="badge">● Sistem Çevrimiçi</div>
    <div class="links">
      <a href="/api/taziyeler" target="_blank">Canlı Taziye Listesi (JSON)</a>
    </div>
  </div>
</body>
</html>
